<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MARGIN CALL — a roguelike day-trading deckbuilder</title>
<meta name="description" content="Hit the daily quota or get liquidated. A 2D roguelike deckbuilder built out of candlesticks." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕯️</text></svg>" />
<link rel="stylesheet" href="src/styles.css" />
<script>
/* Boot watchdog. The game is ES modules, which browsers refuse to load over
   file:// — you get the static shell and nothing else, with no visible reason.
   If main.js has not signalled in, say so in plain language instead. */
(function () {
  window.__MC_BOOT = { ok: false, err: null };
  window.addEventListener('error', function (e) {
    if (!window.__MC_BOOT.err) window.__MC_BOOT.err = (e && (e.message || e.type)) || 'unknown error';
  }, true);

  function panel(title, lines) {
    var wrap = document.createElement('div');
    wrap.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
      'justify-content:center;padding:24px;background:rgba(3,6,12,.96);' +
      'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f2f6ff;overflow:auto');
    wrap.innerHTML =
      '<div style="max-width:660px;width:100%;background:linear-gradient(180deg,#1a2740,#0b1220);' +
      'border:3px solid #43598a;border-radius:16px;padding:28px 30px;box-shadow:0 8px 0 #04070d,0 30px 70px rgba(0,0,0,.8)">' +
      '<div style="font-size:11px;letter-spacing:.26em;color:#ffd24a">MARGIN CALL</div>' +
      '<h1 style="font-size:22px;letter-spacing:.06em;margin:10px 0 14px;line-height:1.3">' + title + '</h1>' +
      lines +
      '</div>';
    document.body.appendChild(wrap);
  }

  setTimeout(function () {
    if (window.__MC_BOOT.ok) return;
    var cmd = 'style="display:block;background:#05080f;border:2px solid #2c3d5f;border-radius:8px;' +
      'padding:10px 12px;margin:8px 0;color:#40d9ff;font-size:13px;user-select:all"';
    if (location.protocol === 'file:') {
      panel('This game needs a local web server',
        '<p style="color:#93a6c6;font-size:13.5px;line-height:1.65">You have opened <b>index.html</b> straight from your ' +
        'hard drive. Browsers block a page loaded that way from importing its own code, so you are looking at an empty ' +
        'shell &mdash; nothing on this screen will respond.</p>' +
        '<p style="color:#93a6c6;font-size:13.5px;line-height:1.65;margin-top:12px">Open a terminal <b>in the game folder</b> ' +
        'and run one of these, then visit <b style="color:#45e08d">http://localhost:8080</b>:</p>' +
        '<code ' + cmd + '>python3 -m http.server 8080</code>' +
        '<code ' + cmd + '>npm start</code>' +
        '<code ' + cmd + '>npx serve -l 8080</code>' +
        '<p style="color:#93a6c6;font-size:13.5px;line-height:1.65;margin-top:12px">Or just double-click ' +
        '<b>start.command</b> (macOS/Linux) or <b>start.bat</b> (Windows) in the game folder &mdash; they do it for you.</p>');
    } else {
      panel('The game failed to start',
        '<p style="color:#93a6c6;font-size:13.5px;line-height:1.65">Something went wrong loading the game code. ' +
        'The error was:</p>' +
        '<code ' + cmd + '>' + String(window.__MC_BOOT.err || 'no error was reported — check the browser console')
          .replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</code>' +
        '<p style="color:#93a6c6;font-size:13.5px;line-height:1.65;margin-top:12px">A hard refresh ' +
        '(<b>Ctrl/Cmd + Shift + R</b>) clears a stale cached copy, which fixes this most of the time.</p>');
    }
  }, 4000);
})();
</script>
</head>
<body>
<div id="crt"></div>
<div id="app" class="app">

  <header id="topbar">
    <div class="brand"><span class="brand-mark">▚</span><span class="brand-name">MARGIN&nbsp;CALL</span></div>
    <div class="topstats">
      <div class="tstat"><label>WEEK</label><b id="t-week">1</b></div>
      <div class="tstat"><label>DEADLINE</label><b id="t-deadline">1 / 3</b></div>
      <div class="tstat cash"><label>CASH</label><b id="t-cash">$8</b></div>
      <div class="tstat"><label>DESK</label><b id="t-slots">0/5</b></div>
    </div>
    <div class="topbtns">
      <button class="mini" id="btn-book" title="View your book">BOOK</button>
      <button class="mini" id="btn-formations" title="Formations">FORMATIONS</button>
      <button class="mini" id="btn-help" title="How to play">?</button>
      <button class="mini" id="btn-menu" title="Menu">≡</button>
    </div>
  </header>

  <main id="main">
    <aside id="left">
      <section id="deadline-card" class="panel deadline-card">
        <div class="dl-tag" id="dl-tag">MORNING BELL</div>
        <div class="dl-art" id="dl-art">🔔</div>
        <div class="dl-quota-label">QUOTA</div>
        <div class="dl-quota" id="dl-quota">$180</div>
        <div class="dl-reward" id="dl-reward">Clears for <b>$4</b></div>
        <div class="dl-boss" id="dl-boss" hidden></div>
        <div class="dl-progress"><div class="dl-progress-fill" id="dl-progress-fill"></div></div>
        <div class="dl-profit"><span id="dl-profit">$0</span><small> booked</small></div>
      </section>

      <section id="score-panel" class="panel score-panel">
        <div class="formation-line">
          <span id="formation-name">—</span>
          <span class="formation-level" id="formation-level"></span>
        </div>
        <div class="score-eq">
          <div class="chip volume" id="sc-volume">0</div>
          <div class="eq-x">×</div>
          <div class="chip leverage" id="sc-leverage">0</div>
        </div>
        <div class="conviction-row" id="conviction-row"><span id="conviction-label">—</span></div>
        <div class="pl-readout"><label>PROJECTED P/L</label><b id="sc-pl">$0</b></div>
      </section>

      <section class="panel resources">
        <div class="res"><label>TRADES</label><b id="r-trades">4</b></div>
        <div class="res"><label>SWEEPS</label><b id="r-sweeps">3</b></div>
        <div class="res"><label>GREEN</label><b id="r-greens" class="green">0</b></div>
        <div class="res"><label>STREAK</label><b id="r-streak">0</b></div>
      </section>

      <section class="panel tape-panel">
        <div class="tape-title">TODAY'S TAPE</div>
        <div class="tape-call" id="tape-call" hidden></div>
        <div class="tape-list" id="tape-list"><div class="tape-empty">no trades booked</div></div>
      </section>

      <section class="panel deckinfo">
        <div class="res"><label>BOOK</label><b id="r-book">52</b></div>
        <div class="res"><label>TO DEAL</label><b id="r-draw">44</b></div>
      </section>
    </aside>

    <section id="right">
      <div id="desk-strip" class="strip">
        <div class="strip-group grow">
          <div class="strip-label">DESK <span id="broker-count">0/5</span></div>
          <div class="strip-cards" id="broker-row"></div>
        </div>
        <div class="strip-divider"></div>
        <div class="strip-group">
          <div class="strip-label">CHARTS <span id="cons-count">0/2</span></div>
          <div class="strip-cards" id="consumable-row"></div>
        </div>
      </div>

      <div id="table">
        <div id="chart-wrap">
          <canvas id="chart"></canvas>
          <div id="chart-overlay">
            <div id="ticker-badge"><span id="ticker-sym">MEME</span><span id="ticker-price">$120.00</span></div>
            <div id="regime-badge"><span id="regime-name">Bull Run</span><small id="regime-blurb"></small></div>
          </div>
          <div id="signal-box">
            <label>DESK SIGNAL</label>
            <div class="signal-arrow" id="signal-arrow">▲</div>
            <div class="signal-conf" id="signal-conf">68% confidence</div>
          </div>
          <div id="fx-layer"></div>
        </div>

        <div id="play-area">
          <div id="position-ghost"><span>YOUR POSITION</span><small>place 1–5 candles left to right, then call the tape</small></div>
          <div id="played-candles"></div>
          <div id="score-burst"></div>
        </div>

        <div id="board-area">
          <div class="pile draw" id="draw-pile">
            <div class="pile-stack" id="draw-stack"></div>
            <div class="pile-face">
              <span class="pile-label">DECK</span>
              <span class="pile-count" id="draw-count">44</span>
            </div>
          </div>
          <div id="board-row"></div>
          <div class="pile swept" id="swept-pile">
            <div class="pile-stack" id="swept-stack"></div>
            <div class="pile-face">
              <span class="pile-label">SWEPT</span>
              <span class="pile-count" id="swept-count">0</span>
            </div>
          </div>
        </div>

        <div id="actions">
          <button class="act long" id="btn-long"><span class="act-glyph">▲</span><span>GO LONG</span></button>
          <button class="act util" id="btn-sweep">SWEEP</button>
          <button class="act util" id="btn-arrange" title="Reorder your placement">ARRANGE ▲</button>
          <button class="act util" id="btn-sort" title="Sort the board">BODY</button>
          <button class="act short" id="btn-short"><span class="act-glyph">▼</span><span>GO SHORT</span></button>
        </div>
      </div>
    </section>
  </main>

  <div id="cash-layer"></div>
  <div id="delta-layer"></div>
  <div id="toast-stack"></div>
  <div id="tooltip" class="tooltip" hidden></div>
</div>

<div id="overlay-root"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
